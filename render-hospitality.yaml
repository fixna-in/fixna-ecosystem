# Hospitality API deployment from fixna-ecosystem monorepo.
# Frontend: deploy frontend/hospitality-web separately (Vercel → hospitality.fixna.in)

services:
  - type: web
    name: fixna-hospitality-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/hospitality-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/readiness
    buildFilter:
      paths:
        - backend/hospitality-api/**
        - backend/libs/fixna-platform-common/**
        - pom.xml
        - render-hospitality.yaml
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FIXNA_APP_ENV
        value: prod
      - key: FIXNA_JWT_SECRET
        sync: false
      - key: FIXNA_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: fixna-hospitality-db
          property: connectionString
      - key: POSTGRES_USER
        fromDatabase:
          name: fixna-hospitality-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: fixna-hospitality-db
          property: password
      - key: FIXNA_HSTS_ENABLED
        value: true
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -Xms256m -Xmx384m

databases:
  - name: fixna-hospitality-db
    databaseName: hospitality
    plan: basic-256mb
    region: singapore