server:
  port: ${SERVER_PORT:${PORT:8084}}

spring:
  profiles:
    default: local
  application:
    name: fixna-hospitality-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospitality}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    # Optional cache. Render has no local Redis — the endpoint must be
    # configurable via REDIS_URL (parity with localboost-api).
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    build:
      enabled: true
  health:
    # Redis is optional (no hospitality feature uses it yet). Excluding the
    # contributor keeps /api/v1/health at 200 on deployments without Redis —
    # otherwise the Render health check fails with 503 (connection refused
    # to localhost:6379) and the deploy is rolled back. Parity with localboost-api.
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    in.fixna.platform: INFO

fixna:
  app-env: ${FIXNA_APP_ENV:local}
  deployed-at: ${FIXNA_DEPLOYED_AT:}
  security:
    jwt:
      secret: ${FIXNA_JWT_SECRET:dev-only-secret-change-me-in-production-32bytes-minimum!!}
      access-ttl: ${FIXNA_JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${FIXNA_JWT_REFRESH_TTL:P7D}
    cors:
      allowed-origins: ${FIXNA_CORS_ALLOWED_ORIGINS:http://localhost:3002,http://127.0.0.1:3002}
    hsts-enabled: ${FIXNA_HSTS_ENABLED:false}
    rate-limit:
      per-ip-per-minute: ${FIXNA_RATE_LIMIT_PER_IP_PER_MINUTE:20}
