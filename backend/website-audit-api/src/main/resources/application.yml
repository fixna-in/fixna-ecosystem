server:
  port: ${SERVER_PORT:${PORT:8082}}

spring:
  profiles:
    default: local
  application:
    name: fixna-website-audit-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/website_audit}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${FIXNA_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${FIXNA_MAX_UPLOAD_SIZE:10MB}
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    in.fixna.websiteaudit: INFO

fixna:
  app-env: ${FIXNA_APP_ENV:local}
  deployed-at: ${FIXNA_DEPLOYED_AT:}
  security:
    jwt:
      secret: ${FIXNA_JWT_SECRET:dev-only-secret-change-me-in-production-32bytes-minimum!!}
      access-ttl: ${FIXNA_JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${FIXNA_JWT_REFRESH_TTL:P7D}
    cors:
      allowed-origins: ${FIXNA_CORS_ALLOWED_ORIGINS:http://localhost:3003}
    hsts-enabled: ${FIXNA_HSTS_ENABLED:false}
    rate-limit:
      per-ip-per-minute: ${FIXNA_RATE_LIMIT_PER_IP_PER_MINUTE:20}
  file-storage:
    base-path: ${FIXNA_FILE_STORAGE_PATH:./data/files}
  website-audit:
    poll-ms: ${FIXNA_WEBSITE_AUDIT_POLL_MS:3000}
    max-pages: ${FIXNA_WEBSITE_AUDIT_MAX_PAGES:25}
    max-concurrency: ${FIXNA_WEBSITE_AUDIT_MAX_CONCURRENCY:2}
    max-depth: ${FIXNA_WEBSITE_AUDIT_MAX_DEPTH:2}
    max-seconds: ${FIXNA_WEBSITE_AUDIT_MAX_SECONDS:60}
    max-fetch-attempts: ${FIXNA_WEBSITE_AUDIT_MAX_FETCH_ATTEMPTS:40}
    per-host-delay-ms: ${FIXNA_WEBSITE_AUDIT_PER_HOST_DELAY_MS:500}
    robots-crawl-delay-cap-seconds: ${FIXNA_WEBSITE_AUDIT_ROBOTS_CRAWL_DELAY_CAP:5}
    page-size-limit-kb: ${FIXNA_WEBSITE_AUDIT_PAGE_SIZE_LIMIT_KB:512}
    user-agent: ${FIXNA_WEBSITE_AUDIT_USER_AGENT:FixnaWebsiteAudit/1.0}
  ai:
    document-processing:
      allowed-providers: ${FIXNA_AI_DOC_PROCESSING_ALLOWED_PROVIDERS:}