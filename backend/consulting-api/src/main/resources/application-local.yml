# Local profile — Consulting API on native PostgreSQL (port 5432).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/consulting}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 9

fixna:
  test-data:
    enabled: ${FIXNA_TEST_DATA_ENABLED:false}
    password: ${FIXNA_TEST_USER_PASSWORD:}
  security:
    cors:
      allowed-origins: ${FIXNA_CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}

logging:
  level:
    in.fixna.platform: DEBUG
