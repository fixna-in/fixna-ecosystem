# Local profile — Consulting API on native PostgreSQL (port 5432).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/consulting_db}
    username: ${POSTGRES_USER:consulting_user}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: false

fixna:
  test-data:
    enabled: false
    password: ${FIXNA_TEST_USER_PASSWORD:}
  security:
    cors:
      allowed-origins: ${FIXNA_CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}

logging:
  level:
    in.fixna.platform: DEBUG
