spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:postgresql://consulting_user:${POSTGRES_PASSWORD}@fixnainfra-postgresadmin-qfasaa:5432/consulting_db}
    username: ${POSTGRES_USER:consulting_user}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

fixna:
  security:
    cors:
      allowed-origins: ${FIXNA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    hsts-enabled: true
    rate-limit:
      per-ip-per-minute: ${FIXNA_RATE_LIMIT_PER_IP_PER_MINUTE:20}
  file-storage:
    base-path: ${FIXNA_FILE_STORAGE_PATH:./data/files}
  ai:
    document-processing:
      allowed-providers: ${FIXNA_AI_DOC_PROCESSING_ALLOWED_PROVIDERS:gpt4,claude3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: always
        show-components: always
      tracing:
        enabled: true

logging:
  level:
    root: INFO
    in.fixna.platform: INFO