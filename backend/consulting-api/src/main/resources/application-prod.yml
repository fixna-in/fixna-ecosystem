spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:postgresql://consulting_user:${POSTGRES_PASSWORD}@fixnainfra-postgresadmin-qfasaa:5432/consulting_db}
    username: ${POSTGRES_USER:consulting_user}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:2000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "9"

fixna:
  security:
    jwt:
      secret: ${FIXNA_JWT_SECRET}
    cors:
      allowed-origins: ${FIXNA_CORS_ALLOWED_ORIGINS:https://consulting.fixna.in}
    hsts-enabled: true
    rate-limit:
      per-ip-per-minute: ${FIXNA_RATE_LIMIT_PER_IP_PER_MINUTE:100}
  ai:
    document-processing:
      allowed-providers: ${FIXNA_AI_DOC_PROCESSING_ALLOWED_PROVIDERS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: ERROR
    in.fixna.platform: WARN
