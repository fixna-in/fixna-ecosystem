server:
  port: ${SERVER_PORT:${PORT:8081}}

spring:
  profiles:
    default: local
  application:
    name: fixna-consulting-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/consulting}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    in.fixna.platform: INFO

fixna:
  app-env: ${FIXNA_APP_ENV:local}
  deployed-at: ${FIXNA_DEPLOYED_AT:}
  security:
    jwt:
      secret: ${FIXNA_JWT_SECRET:dev-only-secret-change-me-in-production-32bytes-minimum!!}
      access-ttl: ${FIXNA_JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${FIXNA_JWT_REFRESH_TTL:P7D}
    cors:
      allowed-origins: ${FIXNA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    hsts-enabled: ${FIXNA_HSTS_ENABLED:false}
  file-storage:
    base-path: ${FIXNA_FILE_STORAGE_PATH:./data/files}
