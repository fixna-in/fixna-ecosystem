server:
  port: ${SERVER_PORT:${PORT:8081}}

spring:
  profiles:
    default: local
  application:
    name: fixna-consulting-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/consulting}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${FIXNA_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${FIXNA_MAX_UPLOAD_SIZE:10MB}
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    in.fixna.platform: INFO

fixna:
  app-env: ${FIXNA_APP_ENV:local}
  deployed-at: ${FIXNA_DEPLOYED_AT:}
  security:
    jwt:
      secret: ${FIXNA_JWT_SECRET:dev-only-secret-change-me-in-production-32bytes-minimum!!}
      access-ttl: ${FIXNA_JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${FIXNA_JWT_REFRESH_TTL:P7D}
    cors:
      allowed-origins: ${FIXNA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    hsts-enabled: ${FIXNA_HSTS_ENABLED:false}
    rate-limit:
      per-ip-per-minute: ${FIXNA_RATE_LIMIT_PER_IP_PER_MINUTE:20}
  file-storage:
    base-path: ${FIXNA_FILE_STORAGE_PATH:./data/files}
  website-audit:
    poll-ms: ${FIXNA_WEBSITE_AUDIT_POLL_MS:3000}
  invoice:
    max-pages: ${FIXNA_INVOICE_MAX_PAGES:50}
    retention-cron: ${FIXNA_INVOICE_RETENTION_CRON:0 30 3 * * *}
    quotas:
      monthly-uploads: ${FIXNA_INVOICE_QUOTA_MONTHLY_UPLOADS:100}
      monthly-extractions: ${FIXNA_INVOICE_QUOTA_MONTHLY_EXTRACTIONS:200}
    signed-url-ttl-minutes: ${FIXNA_INVOICE_SIGNED_URL_TTL_MINUTES:15}
  malware-scanner:
    enabled: ${FIXNA_MALWARE_SCANNER_ENABLED:false}
  ai:
    document-processing:
      allowed-providers: ${FIXNA_AI_DOC_PROCESSING_ALLOWED_PROVIDERS:}
