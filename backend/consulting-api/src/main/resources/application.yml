server:
  port: ${SERVER_PORT:${PORT:80}}

spring:
  profiles:
    default: local
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: consulting-api
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    in.fixna.platform: INFO

