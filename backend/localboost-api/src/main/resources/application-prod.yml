fixna:
  security:
    jwt:
      secret: ${FIXNA_JWT_SECRET:}
      access-ttl: ${FIXNA_JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${FIXNA_JWT_REFRESH_TTL:P7D}
    hsts-enabled: true
  ai:
    provider: ${FIXNA_AI_PROVIDER:mock}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
      export:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}

logging:
  level:
    root: WARN
    in.fixna.platform: INFO

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
