name: Fixna Ecosystem CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-common:
    name: Platform common — test & install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install parent POM
        run: mvn -f pom.xml install -N -B
      - name: Test and install shared library
        run: mvn -f backend/libs/fixna-platform-common/pom.xml -B test install

  localboost-api:
    name: LocalBoost API — test & package
    needs: platform-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install parent POM
        run: mvn -f pom.xml install -N -B
      - name: Install shared library
        run: mvn -f backend/libs/fixna-platform-common/pom.xml -B install -DskipTests
      - name: Run unit tests
        run: mvn -f backend/localboost-api/pom.xml -B test
      - name: Package JAR
        run: mvn -f backend/localboost-api/pom.xml -B -DskipTests package
      - name: Verify migrations present
        run: |
          test "$(ls backend/localboost-api/src/main/resources/db/migration/V*.sql | wc -l)" -ge 9

  hospitality-api:
    name: Hospitality API — test & package
    needs: platform-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install parent POM
        run: mvn -f pom.xml install -N -B
      - name: Install shared library
        run: mvn -f backend/libs/fixna-platform-common/pom.xml -B install -DskipTests
      - name: Run unit tests
        run: mvn -f backend/hospitality-api/pom.xml -B test
      - name: Package JAR
        run: mvn -f backend/hospitality-api/pom.xml -B -DskipTests package
      - name: Verify migrations present
        run: |
          test "$(ls backend/hospitality-api/src/main/resources/db/migration/V*.sql | wc -l)" -ge 1

  localboost-web:
    name: LocalBoost Web — production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build localboost web
        run: npm run build:localboost
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.fixna.in/api
          NEXT_PUBLIC_APP_ENV: ci

  consulting-api:
    name: Consulting API — test & package
    needs: platform-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install parent POM
        run: mvn -f pom.xml install -N -B
      - name: Install shared library
        run: mvn -f backend/libs/fixna-platform-common/pom.xml -B install -DskipTests
      - name: Run unit tests
        run: mvn -f backend/consulting-api/pom.xml -B test
      - name: Package JAR
        run: mvn -f backend/consulting-api/pom.xml -B -DskipTests package
      - name: Verify migrations present
        run: |
          test "$(ls backend/consulting-api/src/main/resources/db/migration/V*.sql | wc -l)" -ge 13

  website-audit-api:
    name: Website Audit API — test & package
    needs: platform-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install parent POM
        run: mvn -f pom.xml install -N -B
      - name: Install shared library
        run: mvn -f backend/libs/fixna-platform-common/pom.xml -B install -DskipTests
      - name: Run unit tests
        run: mvn -f backend/website-audit-api/pom.xml -B test
      - name: Package JAR
        run: mvn -f backend/website-audit-api/pom.xml -B -DskipTests package
      - name: Verify migrations present
        run: |
          test "$(ls backend/website-audit-api/src/main/resources/db/migration/V*.sql | wc -l)" -ge 3

  invoice-assistant-api:
    name: Invoice Assistant API — test & package
    needs: platform-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install parent POM
        run: mvn -f pom.xml install -N -B
      - name: Install shared library
        run: mvn -f backend/libs/fixna-platform-common/pom.xml -B install -DskipTests
      - name: Run unit tests
        run: mvn -f backend/invoice-assistant-api/pom.xml -B test
      - name: Package JAR
        run: mvn -f backend/invoice-assistant-api/pom.xml -B -DskipTests package
      - name: Verify migrations present
        run: |
          test "$(ls backend/invoice-assistant-api/src/main/resources/db/migration/V*.sql | wc -l)" -ge 6

  consulting-web:
    name: Consulting Web — production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build consulting web
        run: npm run build:consulting
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.consulting.fixna.in/api
          NEXT_PUBLIC_APP_ENV: ci

  hospitality-web:
    name: Hospitality Web — production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build hospitality web
        run: npm run build:hospitality
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.hospitality.fixna.in/api
          NEXT_PUBLIC_APP_ENV: ci

  website-audit-web:
    name: Website Audit Web — typecheck, test & production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm --prefix frontend/website-audit-web run typecheck
      - name: Unit tests
        run: npm --prefix frontend/website-audit-web run test
      - name: Build website audit web
        run: npm run build:website-audit
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.audit.fixna.in/api
          NEXT_PUBLIC_APP_ENV: ci

  invoice-assistant-web:
    name: Invoice Assistant Web — typecheck, test & production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm --prefix frontend/invoice-assistant-web run typecheck
      - name: Unit tests
        run: npm --prefix frontend/invoice-assistant-web run test
      - name: Build invoice assistant web
        run: npm run build:invoice-assistant
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.invoices.fixna.in/api
          NEXT_PUBLIC_APP_ENV: ci

  fixna-web:
    name: Fixna Web — typecheck, test & production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm --prefix frontend/fixna-web run typecheck
      - name: Unit tests (contact form handler)
        run: npm --prefix frontend/fixna-web run test
      - name: Build fixna web
        run: npm run build:fixna
        env:
          NEXT_PUBLIC_SITE_URL: https://www.fixna.in
