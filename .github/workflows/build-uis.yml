name: fixna-web image

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace frontend/fixna-web --if-present

      - name: Test
        run: npm run test --workspace frontend/fixna-web --if-present

      - name: Build
        run: npm run build --workspace frontend/fixna-web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ github.repository }}

      - name: Compute image tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_TAG="$(printf '%s' "$BRANCH" | tr '/' '-')"
          echo "branch=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/fixna-web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.tags.outputs.branch }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.tags.outputs.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'dev' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_DEPLOY_HOOK }}"

