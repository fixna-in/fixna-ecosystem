# Local development — All product databases
# Local development — Supporting infrastructure (Redis & Mailhog)
# NOTE: All applications connect to the shared PostgreSQL server directly.

services:
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - fixna-redis:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  fixna-redis:



